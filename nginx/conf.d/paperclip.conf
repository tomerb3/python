server {
    listen 80;
    server_name paperclip.devopsite.top;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name paperclip.devopsite.top;     
    ssl_certificate /home/baum/.acme.sh/devopsite.top_ecv/fullchain.cer;
    ssl_certificate_key /home/baum/.acme.sh/devopsite.top_ecv/devopsite.top.key;
    ssl_trusted_certificate /home/baum/.acme.sh/devopsite.top_ecv/ca.cer;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    proxy_pass http://127.0.0.1:3007;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    }

