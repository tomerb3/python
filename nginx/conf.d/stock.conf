
server {
    listen 443 ssl http2;
    server_name stock.devopsite.top;

    ssl_certificate /home/baum/.acme.sh/devopsite.top_ecv/fullchain.cer;
    ssl_certificate_key /home/baum/.acme.sh/devopsite.top_ecv/devopsite.top.key;
    ssl_trusted_certificate /home/baum/.acme.sh/devopsite.top_ecv/ca.cer;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/stock.devopsite.top.access.log;
    error_log /var/log/nginx/stock.devopsite.top.error.log;

    location / {
        proxy_pass http://192.168.0.179:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }
}







