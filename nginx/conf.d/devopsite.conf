server {
    listen 443 ssl http2;
    server_name devopsite.top;

    ssl_certificate /home/baum/.acme.sh/devopsite.top_ecv/fullchain.cer;
    ssl_certificate_key /home/baum/.acme.sh/devopsite.top_ecv/devopsite.top.key;
    ssl_trusted_certificate /home/baum/.acme.sh/devopsite.top_ecv/ca.cer;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;


    access_log /var/log/nginx/devopsite.top.access.log;
    error_log /var/log/nginx/devopsite.top.error.log;

    root /home/baum/src/web_devops_tb1;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

  location = /admin {
    alias /home/baum/src/web_devops_tb1/admin.html;
    default_type text/html;
   }

# optional (only if you want /admin/ to also work)
location = /admin/ {
    return 301 $scheme://$host/admin;
}

}


server {
    listen 443 ssl http2;
    server_name n8n.devopsite.top;

    ssl_certificate /home/baum/.acme.sh/devopsite.top_ecv/fullchain.cer;
    ssl_certificate_key /home/baum/.acme.sh/devopsite.top_ecv/devopsite.top.key;
    ssl_trusted_certificate /home/baum/.acme.sh/devopsite.top_ecv/ca.cer;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/n8n.devopsite.top.access.log;
    error_log /var/log/nginx/n8n.devopsite.top.error.log;

    location / {
        proxy_pass http://localhost:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }

   location /webhook/ {
    proxy_pass http://localhost:5678/webhook/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect off;
}

location /webhook-test/ {
    proxy_pass http://localhost:5678/webhook-test/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect off;
}


location /rest/ {
    proxy_pass http://localhost:5678/rest/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect off;
}

    location ^~ /mcp-server/ {
        proxy_pass http://localhost:5678;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        chunked_transfer_encoding off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }


    location /mcp/ {
        proxy_pass http://localhost:5678;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
